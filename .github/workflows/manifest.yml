name: Build HF radar manifest

on:
  push:
    branches: [main]
    paths:
      - 'observational/hf_radar/**'      # only when radar files change
      - '!observational/hf_radar/manifest.json'
  workflow_dispatch:                      # adds a "Run workflow" button

permissions:
  contents: write                         # lets it commit the manifest

concurrency:                              # hourly pushes: never two runs at once
  group: manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build manifest
        run: python scripts/build_manifest.py

      - name: Commit it if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add observational/hf_radar/manifest.json
          git diff --cached --quiet || git commit -m "Update HF radar manifest"
          git push
